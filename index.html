<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Ứng dụng tạo đơn thuốc điện tử - Điền thông tin và xuất file PDF chuyên nghiệp">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://tauri.localhost https://tauri.localhost; script-src 'self' 'unsafe-inline' http://tauri.localhost https://tauri.localhost; style-src 'self' 'unsafe-inline' http://tauri.localhost https://tauri.localhost https://fonts.googleapis.com; font-src 'self' http://tauri.localhost https://tauri.localhost https://fonts.gstatic.com; connect-src 'self' http://ipc.localhost https://ipc.localhost http://tauri.localhost https://tauri.localhost http://localhost:3726; img-src 'self' data: blob: http://tauri.localhost https://tauri.localhost; object-src 'none'">
    <title>Electronic Prescription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.min.css">
    <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
    <!-- Header -->
    <header class="app-header" id="app-header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-seal" aria-hidden="true">Rx</div>
                <div class="logo-text">
                    <h1 data-i18n="app.title">Đơn Thuốc Điện Tử</h1>
                    <span class="logo-tag">CLINIC RX</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-ghost" id="btn-history" onclick="openHistory()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span data-i18n="btn.history">Lịch sử</span>
                </button>

                <span class="header-divider" aria-hidden="true"></span>

                <button class="btn btn-primary" id="btn-preview" onclick="togglePreview()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span data-i18n="btn.preview">Xem trước</span>
                </button>

                <button class="btn btn-accent" id="btn-export" onclick="exportPDF()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span data-i18n="btn.exportPdf">Xuất PDF</span>
                </button>

                <!-- More actions dropdown -->
                <div class="dropdown" id="more-dropdown">
                    <button class="btn btn-ghost btn-icon" id="btn-more" onclick="toggleMoreMenu()" aria-label="More actions" data-i18n-title="btn.more">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="more-menu">
                        <button class="dropdown-item" id="btn-save" onclick="saveDraft(); closeMoreMenu()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
                            </svg>
                            <span data-i18n="btn.save">Lưu tạm</span>
                            <span class="kbd-hint">Ctrl+S</span>
                        </button>
                        <button class="dropdown-item" id="btn-export-docx" onclick="exportDOCX(); closeMoreMenu()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                            </svg>
                            <span data-i18n="btn.exportDocx">Xuất DOCX</span>
                            <span class="kbd-hint">Ctrl+D</span>
                        </button>
                        <button class="dropdown-item" onclick="fillSampleData(); closeMoreMenu()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                            </svg>
                            <span data-i18n="btn.fillSample">Điền mẫu</span>
                        </button>
                        <div class="dropdown-sep"></div>
                        <button class="dropdown-item" onclick="resetForm(); closeMoreMenu()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                <path d="M3 3v5h5"/>
                            </svg>
                            <span data-i18n="btn.reset">Làm mới</span>
                            <span class="kbd-hint">Ctrl+N</span>
                        </button>
                    </div>
                </div>

                <button class="btn btn-ghost btn-lang" id="btn-lang"
                    onclick="setLanguage(currentLang()==='vi'?'en':'vi')"
                    title="Switch language / Đổi ngôn ngữ"
                    aria-label="Toggle language">VI</button>
            </div>
        </div>
    </header>

    <!-- Main 2-Column Editorial Clinical Workspace -->
    <main class="main-content">
        <div class="workspace-grid" id="form-panel">

            <!-- Left Sticky Rail: Patient + Follow-up & Sign-off -->
            <div class="workspace-side">

                <!-- 01 · Patient Info -->
                <section class="form-section" id="section-patient">
                    <div class="section-header">
                        <div class="section-title-group">
                            <span class="section-num">01</span>
                            <h2 data-i18n="section.patient">Thông tin bệnh nhân</h2>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-grid-12">
                            <div class="form-group col-12">
                                <label for="hoTen"><span data-i18n="label.hoTen">Họ và tên</span> <span class="req">*</span></label>
                                <input type="text" id="hoTen" maxlength="80" placeholder="VD: Nguyễn Văn An" data-i18n-ph="ph.hoTen" oninput="updatePreview()">
                            </div>
                            <div class="form-group col-6">
                                <label for="namSinh" data-i18n="label.namSinh">Năm sinh</label>
                                <input type="text" id="namSinh" maxlength="10" placeholder="yyyy hoặc dd/mm/yyyy" data-i18n-ph="ph.namSinh" inputmode="numeric" oninput="maskBirth(this); updatePreview()">
                            </div>
                            <div class="form-group col-6">
                                <label for="gioiTinh" data-i18n="label.gioiTinh">Giới tính</label>
                                <select id="gioiTinh" onchange="updatePreview()">
                                    <option value="" data-i18n="opt.selectGender">Chọn</option>
                                    <option value="Nam" data-i18n="opt.male">Nam</option>
                                    <option value="Nữ" data-i18n="opt.female">Nữ</option>
                                </select>
                            </div>
                            <div class="form-group col-12">
                                <label for="ngheNghiep" data-i18n="label.ngheNghiep">Nghề nghiệp</label>
                                <input type="text" id="ngheNghiep" maxlength="80" placeholder="Nhập nghề nghiệp" data-i18n-ph="ph.ngheNghiep" oninput="updatePreview()">
                            </div>
                            <div class="form-group col-12">
                                <label for="diaChi" data-i18n="label.diaChi">Địa chỉ</label>
                                <textarea id="diaChi" rows="2" maxlength="200" placeholder="Nhập địa chỉ" data-i18n-ph="ph.diaChi" oninput="updatePreview()"></textarea>
                            </div>
                            <div class="form-group col-12">
                                <label for="chanDoan"><span data-i18n="label.chanDoan">Chẩn đoán</span> <span class="req">*</span></label>
                                <textarea id="chanDoan" rows="2" placeholder="Nhập chẩn đoán bệnh" data-i18n-ph="ph.chanDoan" oninput="updatePreview()"></textarea>
                            </div>
                            <div class="form-group col-12">
                                <label for="diUng"><span data-i18n="label.diUng">Dị ứng</span> <span class="req">*</span></label>
                                <textarea id="diUng" rows="2" maxlength="200" placeholder="Nhập thông tin dị ứng (nếu có)" data-i18n-ph="ph.diUng" oninput="updatePreview()"></textarea>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 03 · Follow-up & Sign-off -->
                <section class="form-section" id="section-followup">
                    <div class="section-header">
                        <div class="section-title-group">
                            <span class="section-num">03</span>
                            <h2 data-i18n="section.followup">Tái khám &amp; Lời dặn</h2>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-grid-12">
                            <div class="form-group col-6">
                                <label for="ngayKeDon"><span data-i18n="label.ngayKeDon">Ngày kê đơn</span> <span class="req">*</span></label>
                                <div class="date-picker-wrap">
                                    <input type="text" id="ngayKeDon" placeholder="dd/MM/yyyy" maxlength="10" inputmode="numeric" autocomplete="off"
                                        oninput="maskDate(this); syncDatePicker('ngayKeDon'); updatePreview()">
                                    <input type="date" id="ngayKeDon-picker" tabindex="-1" aria-hidden="true"
                                        onchange="syncFromPicker('ngayKeDon')">
                                    <button type="button" class="date-cal-btn"
                                        onclick="openDatePicker('ngayKeDon')"
                                        data-i18n-title="btn.pickDate">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group col-6">
                                <label for="taiKhamNgay"><span data-i18n="label.taiKhamNgay">Hẹn tái khám ngày</span> <span class="req">*</span></label>
                                <div class="date-picker-wrap">
                                    <input type="text" id="taiKhamNgay" placeholder="dd/MM/yyyy" maxlength="10" inputmode="numeric" autocomplete="off"
                                        oninput="maskDate(this); syncDatePicker('taiKhamNgay'); updatePreview()">
                                    <input type="date" id="taiKhamNgay-picker" tabindex="-1" aria-hidden="true"
                                        onchange="syncFromPicker('taiKhamNgay')">
                                    <button type="button" class="date-cal-btn"
                                        onclick="openDatePicker('taiKhamNgay')"
                                        data-i18n-title="btn.pickDate">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group col-12">
                                <label for="loiDan"><span data-i18n="label.loiDan">Lời dặn</span> <span class="req">*</span></label>
                                <textarea id="loiDan" rows="2" maxlength="500" placeholder="Nhập lời dặn cho bệnh nhân" data-i18n-ph="ph.loiDan" oninput="updatePreview()"></textarea>
                            </div>
                            <div class="form-group col-12">
                                <label for="bacSi"><span data-i18n="label.bacSi">Bác sĩ kê đơn</span> <span class="req">*</span></label>
                                <input type="text" id="bacSi" maxlength="80" placeholder="Nhập tên bác sĩ" data-i18n-ph="ph.bacSi" oninput="updatePreview()">
                            </div>
                        </div>
                    </div>
                </section>

            </div>

            <!-- Right Column: 02 · Rx Prescription Ledger (up to 10 medications) -->
            <div class="workspace-main">
                <section class="form-section rx-sheet" id="section-medication">
                    <div class="section-header">
                        <div class="section-title-group">
                            <span class="section-num">02</span>
                            <span class="section-rx-glyph" aria-hidden="true">Rx</span>
                            <h2 data-i18n="section.medication">Thuốc điều trị</h2>
                            <span class="med-count-badge" id="med-count-badge">03 / 10</span>
                            <span class="rx-days-badge" id="rx-days-badge" title="Số ngày dùng thuốc theo ngày tái khám">7 ngày</span>
                        </div>
                        <button type="button" class="btn btn-brand-soft btn-sm" id="btn-add-med-top" onclick="addMedication(true)">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            <span data-i18n="btn.addMed">Thêm thuốc</span>
                        </button>
                    </div>
                    <div class="section-body">
                        <div class="med-table-head" aria-hidden="true">
                            <span>#</span>
                            <span data-i18n="label.medName">Tên thuốc</span>
                            <span><span data-i18n="label.medQty">Số lượng</span> / <span data-i18n="label.medUnit">Đơn vị</span></span>
                            <span></span>
                        </div>
                        <div id="medication-list">
                            <!-- Medications rendered by JS (up to 10) -->
                        </div>
                        <button type="button" class="btn-add" id="btn-add-med" onclick="addMedication(true)">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            <span data-i18n="btn.addMed">Thêm thuốc</span>
                            <span class="kbd-inline">Alt+A</span>
                        </button>
                    </div>
                </section>
            </div>

        </div>

        <!-- Preview Overlay -->
        <div class="preview-overlay" id="preview-panel" onclick="if(event.target===this)togglePreview()">
            <div class="preview-container">
                <div class="preview-toolbar">
                    <h3 data-i18n="preview.title">Xem trước đơn thuốc</h3>
                    <div class="preview-toolbar-actions">
                        <div class="preview-zoom-group" aria-label="Zoom">
                            <button type="button" class="preview-zoom-btn" onclick="previewZoomStep(-0.15)" data-i18n-title="preview.zoomOut" aria-label="Zoom out">−</button>
                            <button type="button" class="preview-zoom-btn preview-zoom-label" id="preview-zoom-label" onclick="previewZoomToggle()" data-i18n-title="preview.fit">Vừa</button>
                            <button type="button" class="preview-zoom-btn" onclick="previewZoomStep(0.15)" data-i18n-title="preview.zoomIn" aria-label="Zoom in">+</button>
                        </div>
                        <button class="btn btn-accent btn-sm" id="btn-export-preview" onclick="exportPDF()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            <span data-i18n="btn.exportPdf">Xuất PDF</span>
                        </button>
                        <button class="btn btn-ghost btn-sm btn-icon" id="btn-close-preview" onclick="togglePreview()" aria-label="Close">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="preview-scroll" id="preview-scroll">
                    <div class="prescription-preview" id="prescription-preview"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Sticky Bottom Action Bar (visible only on <= 640px) -->
    <div class="mobile-action-bar" id="mobile-action-bar">
        <button type="button" class="btn btn-primary" onclick="togglePreview()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <span data-i18n="btn.preview">Xem trước</span>
        </button>
        <button type="button" class="btn btn-accent" id="btn-export-mobile" onclick="exportPDF()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span data-i18n="btn.exportPdf">Xuất PDF</span>
        </button>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="history-modal" onclick="if(event.target===this)closeHistory()">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <h2 data-i18n="history.title">Lịch sử đơn thuốc</h2>
                    <div id="history-storage-src" style="font-family:var(--font-mono);font-size:.7rem;color:#6f6a60;margin-top:2px;max-width:440px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
                </div>
                <button class="btn btn-ghost btn-sm btn-icon" onclick="closeHistory()" aria-label="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-search">
                <input type="text" id="history-search" maxlength="80"
                    placeholder="Tìm theo tên bệnh nhân..."
                    data-i18n-ph="history.search"
                    oninput="renderHistory()"
                    autocomplete="off"
                    spellcheck="false">
            </div>
            <div class="modal-body" id="history-list"></div>
            <div class="modal-footer">
                <label class="btn btn-ghost btn-sm" data-i18n-title="history.import.tooltip" style="cursor:pointer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span data-i18n="history.import">Nhập JSON</span>
                    <input type="file" accept=".json" style="display:none" onchange="importHistory(this)">
                </label>
                <button class="btn btn-ghost btn-sm" onclick="exportHistory()" data-i18n-title="history.export.tooltip">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span data-i18n="history.export">Xuất JSON</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Duplicate Save Modal -->
    <div class="modal-overlay" id="dup-modal">
        <div class="modal-box" style="max-width:520px;height:auto;max-height:85vh">
            <div class="modal-header">
                <div>
                    <h2 style="font-size:1rem" data-i18n="dup.title">Trùng tên bệnh nhân</h2>
                    <div id="dup-subtitle" style="font-size:.82rem;color:#6f6a60;margin-top:2px"></div>
                </div>
            </div>
            <div class="modal-body" style="padding:16px 20px">
                <p id="dup-hint" style="font-size:.86rem;color:#524e46;margin-bottom:12px"></p>
                <div id="dup-list" style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;margin-bottom:16px"></div>
                <div style="display:flex;gap:10px;justify-content:flex-end">
                    <button class="btn btn-ghost btn-sm" onclick="closeDupModal()"><span data-i18n="btn.cancel">Huỷ</span></button>
                    <button class="btn btn-accent btn-sm" onclick="saveDraftNew()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        <span data-i18n="btn.createNew">Tạo mới</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Shared Dose Unit Suggestions -->
    <datalist id="dose-unit-options">
        <option value="viên"></option>
        <option value="ml"></option>
        <option value="gói"></option>
        <option value="giọt"></option>
        <option value="ống"></option>
        <option value="muỗng"></option>
        <option value="nhát xịt"></option>
        <option value="tuýp"></option>
        <option value="chai"></option>
    </datalist>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-icon">✓</div>
        <div class="toast-message" id="toast-message"></div>
    </div>

    <!-- Minified App Bundle (vendor libs lazy-loaded on demand) -->
    <script src="bundle.min.js" defer></script>
</body>
</html>
